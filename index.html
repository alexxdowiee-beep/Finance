<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Forge Finance</title>
<meta name="theme-color" content="#0A0A0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge Finance">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0A0A0B; --surface: #141416; --surface2: #1D1E21;
    --ink: #F5F5F6; --muted: #A1A2A7; --faint: #7D7F85; --line: #26272B;
    --brand: #FF4A16; --brand-ink: #120B07; --gold: #F0B429;
    --good: #5FBF6E; --danger: #E5484D;
    --font-display: 'Anton', 'Arial Narrow', sans-serif;
    --font-body: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  ::-webkit-scrollbar { display:none; }
  .app { max-width: 520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  header.topbar {
    position:sticky; top:0; z-index:20; background: var(--bg);
    padding: calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;
    border-bottom: 2px solid var(--brand);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand { display:flex; align-items:center; gap:9px; }
  .brand svg { width:24px; height:24px; flex-shrink:0; }
  .brand .wordmark { font-size:18px; letter-spacing:0.2em; text-transform:uppercase; font-weight:700; }
  .topbar .sub { font-size:12px; color:var(--muted); font-weight:700; text-align:right; line-height:1.3; }

  main { flex:1; padding:16px 18px 92px; }
  .screen { display:none; }
  .screen.active { display:block; animation: fade .16s ease-out; }
  @keyframes fade { from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:none;} }

  h2.sec { font-family: var(--font-display); font-weight:400; font-size:13px; text-transform:uppercase;
           letter-spacing:0.08em; color: var(--muted); margin:24px 0 9px; }
  h2.sec:first-child { margin-top:0; }

  .card { background: var(--surface); border:1px solid var(--line); border-radius:15px; padding:16px; margin-bottom:12px; }

  .hero { text-align:center; padding:22px 16px; }
  .hero .lbl { font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; }
  .hero .big { font-family: var(--font-display); font-size:38px; line-height:1.1; margin-top:6px; font-variant-numeric: tabular-nums; }
  .hero .big.neg { color: var(--danger); }
  .hero .note { font-size:12px; color:var(--faint); margin-top:7px; }

  .split { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .stat { background: var(--surface); border:1px solid var(--line); border-radius:13px; padding:14px 12px; text-align:center; }
  .stat .v { font-family: var(--font-display); font-size:22px; font-variant-numeric: tabular-nums; }
  .stat .v.out { color: var(--brand); }
  .stat .v.in { color: var(--good); }
  .stat .l { font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-top:3px; }

  .acct { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .acct:last-child { border-bottom:none; }
  .acct .an { flex:1; min-width:0; }
  .acct .an .n { font-size:14px; font-weight:600; }
  .acct .an .b { font-size:12px; color:var(--faint); margin-top:2px; }
  .acct .bal { font-family: var(--font-display); font-size:17px; font-variant-numeric: tabular-nums; }
  .acct .bal.neg { color: var(--danger); }

  .catrow { margin-bottom:13px; }
  .catrow:last-child { margin-bottom:0; }
  .catrow .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; gap:10px; }
  .catrow .cn { font-size:13px; }
  .catrow .cv { font-family: var(--font-display); font-size:15px; font-variant-numeric: tabular-nums; }
  .catrow .cp { font-size:12px; color:var(--faint); margin-left:6px; font-family: var(--font-body); font-weight:700; }
  .track { height:7px; background: var(--surface2); border-radius:4px; overflow:hidden; }
  .fill { height:100%; background: var(--brand); border-radius:4px; }
  .bnote { font-size:12px; margin-top:4px; font-weight:600; }
  .fcnote { font-size:12px; color:var(--faint); line-height:1.5; margin:8px 2px 0; text-align:center; }
  .bill { display:flex; align-items:center; gap:11px; padding:10px 0; cursor:pointer; }
  .bill + .bill { border-top:1px solid var(--line); }
  .bill .bi { flex:1; min-width:0; }
  .bill .bn { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bill .bw { font-size:12px; color:var(--muted); margin-top:3px; font-weight:600; }
  .bill .bw.now { color:var(--gold); }
  .bill .ba { font-family: var(--font-display); font-size:15px; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .fold { display:flex; align-items:center; gap:8px; width:100%; background:none; border:none; color:var(--ink);
          padding:22px 0 10px; cursor:pointer; font:inherit; text-align:left; }
  .fold .ft { font-family: var(--font-display); font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); }
  .fold .fs { margin-left:auto; font-size:12px; font-weight:700; color:var(--ink); font-variant-numeric: tabular-nums; }
  .fold .fc { color:var(--muted); transition: transform .15s; transform: rotate(-90deg); }
  .fold.open .fc { transform: none; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .pchip { background:var(--surface2); border:1px solid var(--line); color:var(--ink); border-radius:20px; padding:6px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .pchip b { color:var(--good); font-weight:700; }
  .t-row { display:flex; align-items:center; gap:8px; } .t-row input { width:90px; }
  .linkbtn { background:none; border:none; color:var(--brand); font:inherit; font-weight:700; padding:0; cursor:pointer; text-decoration:underline; }
  .btotal { font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:11px; margin-top:13px; }
  .brow { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .brow input { width:110px; text-align:right; }

  .tx { display:flex; align-items:center; gap:11px; padding:12px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
  .tx:last-child { border-bottom:none; }
  .tx .ti { flex:1; min-width:0; }
  .tx .tn { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx .tc { font-size:12px; color:var(--muted); margin-top:3px; }
  .tx .tc .chip { background: var(--surface2); border:1px solid var(--line); border-radius:20px; padding:2px 7px; font-weight:700; }
  .tx .tc .chip.none { color: var(--gold); border-color: var(--gold); }
  .tx .tc .chip.pend { color: var(--muted); border-style: dashed; }
  .tx .ta.pend { opacity: 0.6; }
  .tx .ta { font-family: var(--font-display); font-size:15px; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .tx .ta.in { color: var(--good); }
  .daylbl { font-size:12px; color:var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:0.06em; margin:18px 0 2px; }
  .daylbl:first-child { margin-top:0; }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px; }
  .field .hint { font-size:12px; color:var(--faint); margin-top:5px; line-height:1.5; }
  input[type=text], input[type=password], input[type=date], input[type=number], select {
    width:100%; background: var(--surface2); border:1px solid var(--line); color: var(--ink);
    font-family: inherit; font-size:14px; padding:11px 12px; border-radius:10px;
  }
  input:focus, select:focus { outline:2px solid var(--brand); outline-offset:-1px; }

  .btn { border:none; border-radius:13px; padding:14px 18px; font-size:15px; cursor:pointer; width:100%;
         font-family: var(--font-display); font-weight:400; letter-spacing:0.08em; text-transform:uppercase; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); }
  .btn.ghost { background: var(--surface2); border:1px solid var(--line); color: var(--ink); }
  .btn.small { font-family: var(--font-body); font-weight:700; font-size:13px; letter-spacing:0; text-transform:none; padding:10px 14px; border-radius:10px; }
  .btn:active { transform: scale(0.985); }
  .btn.danger { background:none; color: var(--danger); text-decoration:underline; font-family: var(--font-body);
                text-transform:none; letter-spacing:0; font-weight:700; font-size:13px; padding:8px; }

  .seg { display:flex; gap:7px; }
  .seg button { flex:1; background: var(--surface2); border:1px solid var(--line); color: var(--muted);
                border-radius:10px; padding:11px 6px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; }
  .seg button.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

  .banner { border-radius:11px; padding:12px 14px; font-size:13px; line-height:1.5; margin-bottom:14px; }
  .banner.warn { background: rgba(240,180,41,0.1); border:1px dashed var(--gold); color: var(--gold); }
  .banner.bad { background: rgba(229,72,77,0.1); border:1px dashed var(--danger); color: var(--danger); }
  .banner.ok { background: rgba(95,191,110,0.1); border:1px dashed var(--good); color: var(--good); }

  .empty { text-align:center; padding:40px 12px; color: var(--muted); font-size:14px; line-height:1.6; }

  nav.tabbar { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:520px; z-index:30;
    background: var(--surface); border-top:1px solid var(--line); padding-bottom: env(safe-area-inset-bottom,0px); display:flex; }
  .tab { flex:1; border:none; background:none; padding:11px 3px 9px; display:flex; flex-direction:column;
         align-items:center; gap:3px; color: var(--faint); cursor:pointer; font-family: var(--font-body); }
  .tab.active { color: var(--brand); }
  .tab .ic { display:inline-block; padding:2px 14px; border-radius:999px; transition:background .15s; }
  .tab.active .ic { background: rgba(255,74,22,.16); }

  .tab .ic { font-size:16px; }
  .tab .lb { font-size:12px; font-weight:700; }

  .scrim { position:fixed; inset:0; background: rgba(6,7,8,0.82); z-index:50; display:none; align-items:flex-end; }
  .scrim.open { display:flex; }
  .sheet { background: var(--surface); width:100%; max-width:520px; margin:0 auto; border-radius:20px 20px 0 0;
           border-top:2px solid var(--brand); padding:20px 20px calc(env(safe-area-inset-bottom,0px)+24px); max-height:82vh; overflow-y:auto; }
  .sheet h3 { font-family: var(--font-display); font-weight:400; font-size:17px; text-transform:uppercase;
              letter-spacing:0.05em; margin:0 0 4px; }
  .sheet .sub { font-size:12px; color: var(--muted); margin-bottom:16px; }
  .catgrid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .catgrid button { background: var(--surface2); border:1px solid var(--line); color: var(--ink);
                    border-radius:10px; padding:12px 8px; font-size:13px; font-family:inherit; cursor:pointer; text-align:left; }
  .catgrid button.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight:700; }

  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom: calc(env(safe-area-inset-bottom,0px) + 78px);
           background: var(--ink); color: var(--bg); font-size:13px; font-weight:700; padding:10px 18px;
           border-radius:999px; z-index:60; opacity:0; pointer-events:none; transition: opacity .25s, bottom .25s; }
  .toast.show { opacity:1; bottom: calc(env(safe-area-inset-bottom,0px) + 94px); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">
      <svg viewBox="68 68 376 376" aria-hidden="true"><path d="M390.2,154.9 A168,168 0 0 1 179.7,405.7 M121.8,357.1 A168,168 0 0 1 332.3,106.3" fill="none" stroke="var(--brand)" stroke-width="30"/><g fill="var(--ink)" transform="translate(256 256) skewX(-12) translate(-256 -256) translate(173.0 156)"><rect x="0" y="108" width="46" height="92"/><rect x="60" y="58" width="46" height="142"/><rect x="120" y="0" width="46" height="200"/></g></svg>
      <span class="wordmark">Finance</span>
    </span>
    <span class="sub" id="topSub"></span>
  </header>

  <main>
    <section class="screen active" id="screen-overview"></section>
    <section class="screen" id="screen-spending"></section>
    <section class="screen" id="screen-activity"></section>
    <section class="screen" id="screen-settings"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-screen="overview"><span class="ic">&#8962;</span><span class="lb">Home</span></button>
    <button class="tab" data-screen="spending"><span class="ic">&#9650;</span><span class="lb">Spending</span></button>
    <button class="tab" data-screen="activity"><span class="ic">&#8801;</span><span class="lb">History</span></button>
    <button class="tab" data-screen="settings"><span class="ic">&#9881;</span><span class="lb">Settings</span></button>
  </nav>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>

  // Shared date format across all apps (NZ style): "Thu 24 Sep", "24 Sep", "24 September", "Thursday"
  function fmtDate(d, opt) {
    var DS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var ML = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    opt = opt || {}; var out = [];
    if (opt.weekday) out.push(opt.weekday === 'long' ? DL[d.getDay()] : DS[d.getDay()]);
    if (opt.day) out.push(d.getDate());
    if (opt.month) out.push(opt.month === 'long' ? ML[d.getMonth()] : MS[d.getMonth()]);
    return out.join(' ');
  }
(function () {
  "use strict";

  /* ============================================================
     FORGE FINANCE
     Data comes from your Akahu account through your own Cloudflare
     relay (see worker.js). Nothing is sent anywhere else — the
     numbers live in this phone's storage and nowhere on the web.
     ============================================================ */

  var APP_PREFIX = 'finance_';
  var SUMMARY_VERSION = 1;

  var CATEGORIES = [
    'Groceries', 'Eating out', 'Transport', 'Bills & utilities',
    'Rent & mortgage', 'Insurance', 'Health', 'Shopping',
    'Entertainment', 'Subscriptions', 'Savings & transfers', 'Income', 'Other'
  ];

  // Not counted as spending (moving your own money, or money coming in).
  var NOT_SPEND = { 'Savings & transfers': true, 'Income': true };

  // A head start so the first import isn't all "Uncategorised".
  // Your own choices are saved on top of these and always win.
  var SEED_RULES = {
    'COUNTDOWN': 'Groceries', 'WOOLWORTHS': 'Groceries', 'PAK N SAVE': 'Groceries',
    'PAKNSAVE': 'Groceries', 'NEW WORLD': 'Groceries', 'FRESH CHOICE': 'Groceries',
    'FOUR SQUARE': 'Groceries',
    'Z ENERGY': 'Transport', 'BP ': 'Transport', 'MOBIL': 'Transport', 'CALTEX': 'Transport',
    'GULL': 'Transport', 'WAITOMO': 'Transport', 'METRO': 'Transport',
    'MCDONALD': 'Eating out', 'KFC': 'Eating out', 'BURGER': 'Eating out',
    'SUBWAY': 'Eating out', 'PIZZA': 'Eating out', 'CAFE': 'Eating out',
    'UBER EATS': 'Eating out', 'COFFEE': 'Eating out', 'BAKERY': 'Eating out',
    'SPARK': 'Bills & utilities', 'ONE NZ': 'Bills & utilities', 'VODAFONE': 'Bills & utilities',
    '2DEGREES': 'Bills & utilities', 'MERCURY': 'Bills & utilities', 'GENESIS': 'Bills & utilities',
    'CONTACT ENERGY': 'Bills & utilities', 'ELECTRIC KIWI': 'Bills & utilities',
    'MERIDIAN': 'Bills & utilities', 'DISTRICT COUNCIL': 'Bills & utilities',
    'CITY COUNCIL': 'Bills & utilities',
    'NETFLIX': 'Subscriptions', 'SPOTIFY': 'Subscriptions', 'DISNEY': 'Subscriptions',
    'YOUTUBE': 'Subscriptions', 'APPLE.COM': 'Subscriptions', 'GOOGLE': 'Subscriptions',
    'AA INSURANCE': 'Insurance', 'TOWER': 'Insurance', 'AMI ': 'Insurance', 'STATE INSURANCE': 'Insurance',
    'PHARMACY': 'Health', 'UNICHEM': 'Health', 'CHEMIST': 'Health', 'MEDICAL': 'Health',
    'MITRE 10': 'Shopping', 'BUNNINGS': 'Shopping', 'KMART': 'Shopping',
    'WAREHOUSE': 'Shopping', 'BRISCOES': 'Shopping', 'FARMERS': 'Shopping',
    // backstop in case the bank doesn't label transfers properly
    'TRANSFER TO': 'Savings & transfers', 'TRANSFER FROM': 'Savings & transfers',
    'INTERNET TRANSFER': 'Savings & transfers'
  };

  var $ = function (id) { return document.getElementById(id); };

  var store = {
    get: function (k, fb) {
      try { var v = localStorage.getItem(APP_PREFIX + k); return v ? JSON.parse(v) : fb; }
      catch (e) { return fb; }
    },
    set: function (k, v) {
      try { localStorage.setItem(APP_PREFIX + k, JSON.stringify(v)); }
      catch (e) { toast('Could not save — storage may be full'); }
    }
  };

  var settings = store.get('settings', { relayUrl: '', relayKey: '', period: 'month', anchor: '', historyDays: 90 });
  var cache = store.get('cache', { accounts: [], transactions: [], syncedAt: null });
  var rules = store.get('rules', {});
  // Monthly budget per category, e.g. { 'Groceries': 600 }. Stored as monthly
  // amounts; on a fortnightly cycle they're scaled to a fortnight (x 12/26).
  var budgets = store.get('budgets', {});
  // Shops you've said aren't regular bills, e.g. { 'KMART HORNBY': true }.
  var notBills = store.get('notBills', {});
  // Bills you split with someone, keyed by the bill's shop, e.g.
  // { 'ELECTRIC KIWI': { share: 50, from: 'DOWIE', who: 'William', cat: 'Bills & utilities' } }
  // share = your percentage; from = text on their repayments.
  var shared = store.get('shared', {});
  // Which fold-away sections are open. Folded unless you've opened them.
  var openSections = store.get('openSections', {});
  var syncing = false;
  var lastError = null;

  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2300);
  }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function money(n) {
    if (n === null || n === undefined || isNaN(n)) return '–';
    try { return Number(n).toLocaleString('en-NZ', { style:'currency', currency:'NZD', maximumFractionDigits: 0 }); }
    catch (e) { return '$' + Math.round(Number(n)).toLocaleString(); }
  }
  function moneyExact(n) {
    if (n === null || n === undefined || isNaN(n)) return '–';
    try { return Number(n).toLocaleString('en-NZ', { style:'currency', currency:'NZD' }); }
    catch (e) { return '$' + Number(n).toFixed(2); }
  }

  function dstr(d) {
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), a = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + a;
  }

  /* ---- which stretch of time are we looking at ---- */
  function periodRange() {
    var now = new Date(); now.setHours(23,59,59,999);
    if (settings.period === 'fortnight' && settings.anchor) {
      var anchor = new Date(settings.anchor + 'T00:00:00');
      if (!isNaN(anchor.getTime())) {
        var ms = 14 * 86400000;
        var diff = Date.now() - anchor.getTime();
        var periodsPassed = Math.floor(diff / ms);
        var start = new Date(anchor.getTime() + periodsPassed * ms);
        start.setHours(0,0,0,0);
        var end = new Date(start.getTime() + ms - 1);
        return { start: start, end: end, label: 'this fortnight',
                 nextLabel: 'Next pay ' + fmtDate(new Date(start.getTime() + ms), {day:'numeric',month:'short'}) };
      }
    }
    var s = new Date(); s.setDate(1); s.setHours(0,0,0,0);
    // The period ends when the MONTH ends, not today — "days to go" and the
    // projection both count from here, and there are no future transactions
    // to sweep up anyway.
    var e = new Date(s.getFullYear(), s.getMonth() + 1, 0, 23, 59, 59, 999);
    return { start: s, end: e, label: 'this month', nextLabel: null };
  }
  function prevRange(r) {
    if (settings.period === 'fortnight' && settings.anchor) {
      return { start: new Date(r.start.getTime() - 14*86400000), end: new Date(r.start.getTime() - 1) };
    }
    var s = new Date(r.start); s.setMonth(s.getMonth() - 1);
    var e = new Date(r.start.getTime() - 1);
    return { start: s, end: e };
  }

  // The same distance into the LAST period as we are into this one.
  // Comparing three days of this month against a whole previous month
  // flatters you early and scolds you late — this compares like with like.
  function prevSoFar(r) {
    var elapsed = Date.now() - r.start.getTime();
    var prev = prevRange(r);
    var end = new Date(Math.min(prev.start.getTime() + elapsed, prev.end.getTime()));
    return { start: prev.start, end: end };
  }

  function daysLeftIn(r) {
    return Math.max(0, Math.ceil((r.end.getTime() - Date.now()) / 86400000));
  }
  function daysElapsedIn(r) {
    return Math.max(1, Math.ceil((Date.now() - r.start.getTime()) / 86400000));
  }

  /* ---- working out what a transaction was for ---- */
  // Bank statement lines are full of padding — "POS W/D", "VISA PURCHASE",
  // card numbers, reference numbers. Strip all that out so what's left is
  // the actual shop name, which is the thing worth remembering.
  var NOISE = /^(POS|WD|W|D|EFTPOS|VISA|MASTERCARD|MC|CARD|PURCHASE|PAYMENT|PMT|DEBIT|CREDIT|DIRECT|AUTOMATIC|AUTO|TFR|TRANSFER|ONLINE|INTERNET|BILL|DD|AP|SO|TO|FROM|REF|NZ|LTD|LIMITED|PTY|THE)$/;

  function txKey(t) {
    if (t.merchant && t.merchant.name) return t.merchant.name.toUpperCase();
    var words = String(t.description || '')
      .toUpperCase()
      .replace(/[^A-Z0-9 ]/g, ' ')
      .split(/\s+/)
      .filter(function (w) {
        if (!w || w.length < 2) return false;
        if (NOISE.test(w)) return false;
        if (/^\d+$/.test(w)) return false;          // card / reference numbers
        if (/^X+\d*$/.test(w)) return false;        // masked card digits
        return true;
      });
    return words.slice(0, 3).join(' ') || 'OTHER';
  }
  // Akahu labels shops with its own detailed names ("Supermarkets and
  // grocery stores", "Cafes and restaurants" ...). Turn those into this app's
  // categories so budgets and refunds line up. Anything it doesn't recognise
  // keeps Akahu's name, which still counts as spending.
  var AKAHU_MAP = [
    [/salary|wage|payroll|income|interest|dividend|government benefit/, 'Income'],
    [/transfer/, 'Savings & transfers'],
    [/supermarket|grocer|butcher|greengrocer|bakeries|bakery|liquor|food retail/, 'Groceries'],
    [/cafe|restaurant|takeaway|take-away|fast food|\bbars?\b|\bpubs?\b|food delivery|dining|coffee/, 'Eating out'],
    [/fuel|petrol|service station|parking|public transport|taxi|ride ?share|toll|automotive|vehicle|car /, 'Transport'],
    [/electricity|gas |energy|internet|broadband|telecommunication|mobile|phone|water|utilit|council|rates/, 'Bills & utilities'],
    [/\brent\b|mortgage|property management|real estate/, 'Rent & mortgage'],
    [/insurance/, 'Insurance'],
    [/pharmac|chemist|medical|doctor|dental|dentist|health|optometr|hospital|physio/, 'Health'],
    [/subscription|streaming|software/, 'Subscriptions'],
    [/entertainment|cinema|movie|gaming|recreation|sport|gym|fitness|event|ticket/, 'Entertainment'],
    [/clothing|apparel|department|hardware|electronics|retail|homeware|furniture|shop|store/, 'Shopping']
  ];
  function fromAkahu(c) {
    var names = [c.name, c.groups && c.groups.personal_finance && c.groups.personal_finance.name]
      .filter(Boolean).join(' | ').toLowerCase();
    for (var i = 0; i < AKAHU_MAP.length; i++) {
      if (AKAHU_MAP[i][0].test(names)) return AKAHU_MAP[i][1];
    }
    return c.name;
  }

  // Is this money coming in someone paying you back for a shared bill?
  function sharedFor(t) {
    if (!(Number(t.amount) > 0)) return null;
    var desc = (txKey(t) + ' ' + (t.description || '') + ' ' + (t.merchant && t.merchant.name || '')).toUpperCase();
    for (var k in shared) {
      var f = String(shared[k].from || '').trim().toUpperCase();
      if (f && desc.indexOf(f) !== -1) return shared[k];
    }
    return null;
  }

  function categoryOf(t) {
    var key = txKey(t);
    // A repayment for a shared bill belongs with that bill, so it makes the
    // bill's category smaller (like a refund) instead of counting as pay.
    var sh = sharedFor(t);
    if (sh) return sh.cat || 'Bills & utilities';
    if (rules[key]) return rules[key];                      // what you chose before
    // Moving money between your own accounts isn't spending, and the bank
    // usually tells us so outright.
    if (t.type === 'TRANSFER') return 'Savings & transfers';
    var desc = ((t.description || '') + ' ' + (t.merchant && t.merchant.name || '')).toUpperCase();
    for (var seed in SEED_RULES) {
      if (desc.indexOf(seed) !== -1) return SEED_RULES[seed];
    }
    if (t.category && t.category.name) return fromAkahu(t.category);   // Akahu's own, if we get it
    if (Number(t.amount) > 0) return 'Income';
    return 'Uncategorised';
  }
  function setCategory(t, cat) {
    rules[txKey(t)] = cat;
    store.set('rules', rules);
  }

  // Settled transactions plus ones the bank hasn't finished processing yet.
  // Pending ones carry _pending: true so they can be labelled.
  function pendingOutIn(r) {
    return (cache.pending || []).reduce(function (sum, t) {
      var d = new Date(t.date).getTime(), a = Number(t.amount) || 0;
      return (d >= r.start.getTime() && d <= r.end.getTime() && a < 0) ? sum + Math.abs(a) : sum;
    }, 0);
  }
  function allTx() {
    return (cache.transactions || []).concat(cache.pending || []);
  }

  function txInRange(r) {
    return allTx().filter(function (t) {
      var d = new Date(t.date).getTime();
      return d >= r.start.getTime() && d <= r.end.getTime();
    });
  }
  // Categories that are spending (everything except money in and own-money moves).
  var SPEND_CATS = CATEGORIES.filter(function (c) { return !NOT_SPEND[c]; });
  // Everything except money in and own-money moves is spending — including
  // Akahu category names the app doesn't recognise.
  function isSpendCat(c) { return !NOT_SPEND[c]; }

  function totals(list) {
    var income = 0, refunds = 0, byCat = {};
    list.forEach(function (t) {
      var amt = Number(t.amount) || 0;
      var cat = categoryOf(t);
      if (amt > 0) {
        // Money back from a shop (a refund) makes that category's spending
        // smaller. It isn't pay, so it mustn't count as income.
        if (isSpendCat(cat)) { byCat[cat] = (byCat[cat] || 0) - amt; refunds += amt; return; }
        if (!NOT_SPEND[cat] || cat === 'Income') income += amt;
        return;
      }
      if (NOT_SPEND[cat]) return;               // own-money moves don't count as spending
      byCat[cat] = (byCat[cat] || 0) + Math.abs(amt);
    });
    // A refund bigger than what was spent in that category (e.g. you bought
    // it last month) can't make spending negative — it just clears it.
    var out = 0;
    Object.keys(byCat).forEach(function (c) {
      if (byCat[c] <= 0.005) delete byCat[c]; else out += byCat[c];
    });
    return { out: out, income: income, refunds: refunds, byCat: byCat };
  }
  function netPosition() {
    if (!cache.accounts || !cache.accounts.length) return null;
    return cache.accounts.reduce(function (sum, a) {
      var v = a.balance && typeof a.balance.current === 'number' ? a.balance.current : 0;
      return sum + v;
    }, 0);
  }
  // One big net number can be misleading when a mortgage is in the mix,
  // so we show what you have and what you owe alongside it.
  function assetsAndDebt() {
    var assets = 0, debt = 0;
    (cache.accounts || []).forEach(function (a) {
      var v = a.balance && typeof a.balance.current === 'number' ? a.balance.current : 0;
      if (v < 0) debt += Math.abs(v); else assets += v;
    });
    return { assets: assets, debt: debt };
  }

  /* ---- talking to your relay ---- */
  function relayGet(path) {
    var base = (settings.relayUrl || '').trim().replace(/\/+$/, '');
    if (!base) return Promise.reject(new Error('No relay address set.'));
    // People paste the address without https:// — without it the browser
    // treats it as a folder on this site and we get a web page back.
    if (!/^https?:\/\//i.test(base)) base = 'https://' + base;

    return fetch(base + path, { headers: { 'X-Relay-Key': settings.relayKey || '' }, cache: 'no-store' })
      .then(function (r) {
        return r.text().then(function (text) {
          var body;
          try { body = JSON.parse(text); }
          catch (e) {
            if (/^\s*</.test(text)) {
              throw new Error('That address gave back a web page, not data. It should start with https:// and end in .workers.dev');
            }
            throw new Error('Unreadable reply from the relay (status ' + r.status + ').');
          }
          if (!r.ok) throw new Error(body && body.error ? body.error : ('Relay returned ' + r.status));
          return body;
        });
      })
      .catch(function (e) {
        if (e instanceof TypeError) {
          throw new Error('Could not reach that address at all. Check the worker is deployed and the address is right.');
        }
        throw e;
      });
  }

  function sync() {
    if (syncing) return;
    if (!settings.relayUrl || !settings.relayKey) { switchScreen('settings'); toast('Add your relay details first'); return; }
    syncing = true; lastError = null; render();

    var since = new Date(); since.setDate(since.getDate() - (Number(settings.historyDays) || 90));

    Promise.all([
      relayGet('/accounts'),
      relayGet('/transactions?start=' + encodeURIComponent(since.toISOString())),
      // Pending is a bonus: an older relay without it (or a hiccup) must
      // never stop the rest updating, so failures here just mean "none".
      relayGet('/transactions/pending').then(function (b) { return { ok: true, body: b }; },
                                              function () { return { ok: false }; })
    ]).then(function (res) {
      var accounts = res[0] && res[0].items ? res[0].items : (Array.isArray(res[0]) ? res[0] : []);
      var txs = res[1] && res[1].items ? res[1].items : [];
      var pend = res[2].ok && res[2].body && res[2].body.items ? res[2].body.items : [];
      pend = pend.map(function (t) { return Object.assign({}, t, { _pending: true }); });
      cache = { accounts: accounts, transactions: txs, pending: pend,
                pendingAvailable: res[2].ok, truncated: !!(res[1] && res[1].truncated),
                syncedAt: new Date().toISOString() };
      store.set('cache', cache);
      publishSummary();
      toast('Updated — ' + txs.length + ' transactions' + (pend.length ? ' + ' + pend.length + ' pending' : ''));
    }).catch(function (e) {
      lastError = e.message || String(e);
      toast('Could not update');
    }).then(function () {
      syncing = false; render();
    });
  }

  /* ---- the small shared summary, same as the other apps ---- */
  function cumulativeSpend(start, end) {
    var out = [], run = 0, d = new Date(start); d.setHours(0, 0, 0, 0);
    for (var i = 0; i < 40 && d.getTime() <= end.getTime(); i++) {
      var e = new Date(d); e.setHours(23, 59, 59, 999);
      run += totals(txInRange({ start: d, end: e })).out;
      out.push(Math.round(run));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }
  function publishSummary() {
    try {
      var r = periodRange();
      var t = totals(txInRange(r));
      var np = netPosition();
      var top = Object.keys(t.byCat).sort(function (a,b) { return t.byCat[b] - t.byCat[a]; })[0] || null;
      var up = upcomingIn(r);
      store.set('summary', {
        schemaVersion: SUMMARY_VERSION,
        updatedAt: new Date().toISOString(),
        appId: 'finance',
        headline: money(t.out) + ' spent ' + r.label,
        data: {
          periodLabel: r.label,
          periodStart: r.start.toISOString(),
          periodEnd: r.end.toISOString(),
          budgetTotal: Math.round(SPEND_CATS.reduce(function (sum, c) { return sum + budgetFor(c); }, 0)) || null,
          // spending in just the categories that HAVE a budget — the fair thing to compare budgetTotal with
          spentInBudgets: Math.round(SPEND_CATS.filter(function (c) { return budgetFor(c) > 0; }).reduce(function (sum, c) { return sum + (t.byCat[c] || 0); }, 0)),
          daysLeftInPeriod: daysLeftIn(r),
          spentThisPeriod: Math.round(t.out),
          incomeThisPeriod: Math.round(t.income),
          netPositionNzd: np === null ? null : Math.round(np),
          topCategory: top,
          accountCount: (cache.accounts || []).length,
          pendingSpend: Math.round(pendingOutIn(r)),
          leftOfPay: t.income > 0 ? Math.round(t.income - t.out) : null,
          upcomingBillsTotal: Math.round(sumUpcoming(up)),
          nextBill: up.length ? { name: up[0].bill.name, date: dstr(up[0].date), amount: Math.round(up[0].bill.amount) } : null,
          budgetsOver: SPEND_CATS.filter(function (c) { return budgetFor(c) && (t.byCat[c] || 0) > budgetFor(c); }),
          lastSyncedAt: cache.syncedAt,
          // ---- detail for the Dashboard's charts and suggestions ----
          budgets: (function () {
            var fc = forecast(r);
            return SPEND_CATS.filter(function (c) { return budgetFor(c) > 0; }).map(function (c) {
              return { cat: c, budget: Math.round(budgetFor(c)), spent: Math.round(t.byCat[c] || 0), forecast: Math.round(fc.forCat(c)) };
            });
          })(),
          owed: sharedOwed(r).map(function (o) { return { who: o.who, bill: o.key, amount: Math.round(o.owed) }; }),
          upcomingBills: up.slice(0, 6).map(function (u) { return { name: u.bill.name, date: dstr(u.date), amount: Math.round(u.bill.amount) }; }),
          // Running total of spending, day by day, this period and the last one.
          spendByDay: cumulativeSpend(r.start, new Date(Math.min(Date.now(), r.end.getTime()))),
          lastPeriodByDay: (function () { var pr = prevRange(r); return cumulativeSpend(pr.start, pr.end); })()
        }
      });
    } catch (e) {}
  }

  /* ================= screens ================= */

  function agoText(iso) {
    if (!iso) return 'never synced';
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 1) return 'synced just now';
    if (mins < 60) return 'synced ' + mins + 'm ago';
    var h = Math.round(mins / 60);
    if (h < 24) return 'synced ' + h + 'h ago';
    var d = Math.round(h / 24);
    return 'synced ' + d + (d === 1 ? ' day ago' : ' days ago');
  }

  function notSetUpHtml() {
    return '<div class="empty">Forge Finance isn\'t connected yet.<br><br>' +
           'Open <b>Settings</b> and paste in your relay address and password. ' +
           'Your Akahu tokens stay on the relay — they never come near this app.</div>';
  }

  function renderOverview() {
    var el = $('screen-overview');
    if (!settings.relayUrl || !settings.relayKey) { el.innerHTML = notSetUpHtml(); return; }

    var r = periodRange();
    var t = totals(txInRange(r));
    var pSoFar = totals(txInRange(prevSoFar(r)));
    var np = netPosition();
    var ad = assetsAndDebt();

    var left = daysLeftIn(r);
    var elapsed = daysElapsedIn(r);
    var fc = forecast(r);
    var perDay = fc.perDay;
    var projected = fc.total;

    // If pay has landed in this period, what's left of it is the number
    // worth waking up to. If it hasn't, fall back to what's gone out.
    var hasIncome = t.income > 0;
    var heroVal = hasIncome ? (t.income - t.out) : t.out;
    var upcoming = upcomingIn(r);
    var upTotal = sumUpcoming(upcoming);
    var periodWord = settings.period === 'fortnight' ? 'fortnight' : 'month';

    var html = '';
    if (lastError) {
      html += '<div class="banner bad"><b>Couldn\'t reach your relay.</b><br>' + esc(lastError) + '</div>';
    }
    if (!cache.syncedAt) {
      html += '<div class="banner warn">No data yet — tap Update below to pull it in.</div>';
    }
    if (cache.syncedAt && cache.pendingAvailable === false) {
      html += '<div class="banner warn">Recent card purchases that haven\'t cleared yet aren\'t included — ' +
              'your relay needs the latest worker code to fetch them.</div>';
    }
    if (cache.truncated) {
      html += '<div class="banner warn">Not all of your history came through (too many transactions). ' +
              'Lower "How much history to pull" in Settings.</div>';
    }

    html += '<div class="card hero">' +
              '<div class="lbl">' + (hasIncome
                ? 'Left of this ' + esc(periodWord) + '’s pay'
                : 'Spent ' + esc(r.label)) + '</div>' +
              '<div class="big' + (heroVal < 0 ? ' neg' : '') + '">' + money(heroVal) + '</div>' +
              '<div class="note">' +
                (hasIncome ? money(t.out) + ' spent of ' + money(t.income) + '<br>' : '') +
                (pendingOutIn(r) > 0 ? 'includes ' + money(pendingOutIn(r)) + ' still clearing<br>' : '') +
                (hasIncome && upTotal > 0 ? '≈ ' + money(heroVal - upTotal) + ' after bills still to come<br>' : '') +
                (left > 0
                  ? left + (left === 1 ? ' day to go' : ' days to go') +
                    (r.nextLabel ? ' · ' + esc(r.nextLabel) : '')
                  : 'last day of the ' + esc(periodWord)) +
              '</div>' +
            '</div>';

    if (t.out > 0) {
      html += '<div class="split">' +
                '<div class="stat"><div class="v out">' + money(perDay) + '</div><div class="l">a day, everyday spending</div></div>' +
                '<div class="stat" id="fcStat"><div class="v">' + money(projected) + '</div><div class="l">likely total by ' +
                  esc(fmtDate(r.end, { day: 'numeric', month: 'short' })) + '</div></div>' +
              '</div>' +
              '<div class="fcnote">' + money(t.out) + ' spent so far' +
                (left > 0 ? ' + ' + money(perDay) + ' a day × ' + left + (left === 1 ? ' day' : ' days') : '') +
                (fc.upcoming > 0 ? ' + ' + money(fc.upcoming) + ' bills still to come' : '') +
                '. Regular bills aren\'t counted in the daily pace.</div>';
    }

    // Like for like: same point last period, not a whole finished one.
    if (pSoFar.out > 0) {
      var diff = Math.round((t.out - pSoFar.out) / pSoFar.out * 100);
      html += '<div class="banner ' + (diff <= 0 ? 'ok' : 'warn') + '" style="margin-top:12px;">' +
              (diff === 0 ? 'Level with' : (diff < 0 ? 'Down ' + Math.abs(diff) + '% on' : 'Up ' + diff + '% on')) +
              ' the same point last ' + esc(periodWord) + ' (' + money(pSoFar.out) + ' by now).</div>';
    }

    html += '<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">' +
              '<div><div style="font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;">Net position</div>' +
                '<div style="font-size:12px;color:var(--faint);margin-top:3px;">' +
                  (np === null ? esc(agoText(cache.syncedAt))
                               : money(ad.assets) + ' held' + (ad.debt ? ' · ' + money(ad.debt) + ' owing' : '')) +
                '</div></div>' +
              '<div style="font-family:var(--font-display);font-size:19px;font-variant-numeric:tabular-nums;' +
                (np !== null && np < 0 ? 'color:var(--danger);' : '') + '">' +
                (np === null ? '–' : money(np)) + '</div>' +
            '</div>';

    html += owedHtml(r);
    if (upcoming.length) {
      html += foldHtml('upcoming', 'Coming up ' + (r.nextLabel ? 'before payday' : 'this month'),
                       upcoming.length + ' · ≈ ' + money(upTotal), '<div class="card">' +
        upcoming.slice(0, 8).map(function (u, i) {
          return '<div class="bill" data-u="' + i + '"><div class="bi"><div class="bn">' + esc(u.bill.name) + '</div>' +
                   '<div class="bw' + (u.bill.dueNow && u.date.getTime() === u.bill.next.getTime() ? ' now' : '') + '">' +
                     esc(whenWord(u.date, u.bill.dueNow && u.date.getTime() === u.bill.next.getTime())) +
                   ' · ' + FREQ_WORD[u.bill.freq] + billSub(u.bill) + '</div></div>' +
                 '<div class="ba">' + billAmt(u.bill) + '</div></div>';
        }).join('') +
        (upcoming.length > 8 ? '<div class="btotal">+ ' + (upcoming.length - 8) + ' more</div>' : '') +
        '<div class="btotal">≈ ' + money(upTotal) + ' still to come · spotted from your history, so check it looks right</div>' +
      '</div>');
    }

    html += '<h2 class="sec">Accounts</h2><div class="card">';
    if (!(cache.accounts || []).length) {
      html += '<div style="color:var(--muted);font-size:13px;">Nothing yet.</div>';
    } else {
      html += cache.accounts.map(function (a) {
        var bal = a.balance && typeof a.balance.current === 'number' ? a.balance.current : null;
        return '<div class="acct"><div class="an">' +
                 '<div class="n">' + esc(a.name || 'Account') + '</div>' +
                 '<div class="b">' + esc((a.connection && a.connection.name) || a.type || '') + '</div>' +
               '</div><div class="bal' + (bal !== null && bal < 0 ? ' neg' : '') + '">' +
                 (bal === null ? '–' : money(bal)) + '</div></div>';
      }).join('');
    }
    html += '</div>';

    html += '<button class="btn primary" id="syncBtn">' + (syncing ? 'Updating…' : 'Update now') + '</button>';
    el.innerHTML = html;
    if ($('syncBtn')) $('syncBtn').addEventListener('click', sync);
    wireFolds(el);
    Array.prototype.forEach.call(el.querySelectorAll('.bill[data-u]'), function (row) {
      row.addEventListener('click', function () { openBillSheet(upcoming[Number(row.dataset.u)].bill); });
    });
  }


  /* ---- regular bills & subscriptions, spotted from your history ---- */
  // Day-to-day spending repeats too (a weekly supermarket shop), but it isn't
  // a bill, so these categories are never treated as one.
  var NOT_BILL_CATS = { 'Groceries': true, 'Eating out': true, 'Transport': true };
  // Bills whose amount naturally moves around month to month.
  var VARIABLE_OK = { 'Bills & utilities': true, 'Rent & mortgage': true, 'Insurance': true };
  var DAY = 86400000;

  function dayStart(d) { var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function addMonth(d) {
    var x = new Date(d), day = x.getDate();
    x.setDate(1); x.setMonth(x.getMonth() + 1);
    x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate()));
    return x;
  }
  function stepFrom(d, freq) {
    return freq === 'monthly' ? addMonth(d) : new Date(d.getTime() + (freq === 'weekly' ? 7 : 14) * DAY);
  }
  var FREQ_WORD = { weekly: 'Weekly', fortnightly: 'Fortnightly', monthly: 'Monthly' };
  var PER_MONTH = { weekly: 52 / 12, fortnightly: 26 / 12, monthly: 1 };

  function detectBills() {
    var groups = {};
    allTx().forEach(function (t) {
      var amt = Number(t.amount) || 0;
      if (amt >= 0) return;
      var cat = categoryOf(t);
      if (NOT_SPEND[cat] || NOT_BILL_CATS[cat]) return;
      var k = txKey(t);
      (groups[k] = groups[k] || { key: k, cat: cat, items: [] }).items.push(t);
    });

    var today = dayStart(new Date());
    var bills = [];
    Object.keys(groups).forEach(function (k) {
      if (notBills[k]) return;
      var g = groups[k];
      // one payment per day at most, oldest first
      var byDay = {};
      g.items.forEach(function (t) { byDay[dstr(dayStart(t.date))] = t; });
      var items = Object.keys(byDay).sort().map(function (d) { return byDay[d]; });
      if (items.length < 2) return;

      var gaps = [];
      for (var i = 1; i < items.length; i++) {
        gaps.push(Math.round((dayStart(items[i].date) - dayStart(items[i - 1].date)) / DAY));
      }
      // Real history is a bit messy (a payment retried, one that clears a day
      // late), so with enough payments one odd gap is forgiven.
      function fits(lo, hi) {
        var ok = gaps.filter(function (x) { return x >= lo && x <= hi; }).length;
        return ok === gaps.length || (gaps.length >= 3 && ok >= gaps.length - 1);
      }
      var freq = null;
      if (fits(26, 35)) freq = 'monthly';
      else if (items.length >= 3 && fits(12, 16)) freq = 'fortnightly';
      else if (items.length >= 3 && fits(6, 8)) freq = 'weekly';
      if (!freq) return;

      var amts = items.map(function (t) { return Math.abs(Number(t.amount) || 0); });
      var hi = Math.max.apply(null, amts), lo = Math.min.apply(null, amts);
      var variable = hi > 0 && (hi - lo) / hi > 0.15;
      if (variable && !VARIABLE_OK[g.cat]) return;
      var recent = amts.slice(-3);
      var amount = variable ? recent.reduce(function (a, b) { return a + b; }, 0) / recent.length : amts[amts.length - 1];

      var last = items[items.length - 1];
      var next = dayStart(stepFrom(dayStart(last.date), freq));
      var lateBy = Math.round((today - next) / DAY);
      if (lateBy > (freq === 'weekly' ? 3 : 6)) return;   // looks like it has stopped
      var dueNow = lateBy > 0;
      if (dueNow) next = today;                           // a few days late — expect it any day

      var sh = shared[k];
      var full = amount;
      if (sh) amount = amount * (Number(sh.share) || 100) / 100;

      bills.push({
        key: k, cat: g.cat, freq: freq, amount: amount, full: full, shared: sh || null,
        variable: variable, next: next, dueNow: dueNow,
        name: (last.merchant && last.merchant.name) || last.description || k,
        count: items.length, perMonth: amount * PER_MONTH[freq]
      });
    });
    return bills.sort(function (a, b) { return a.next - b.next; });
  }

  // Every bill payment still to come between today and the end of the period
  // (weekly ones can land more than once).
  function upcomingIn(r, bills) {
    var out = [];
    (bills || detectBills()).forEach(function (b) {
      for (var d = b.next, n = 0; d.getTime() <= r.end.getTime() && n < 6; d = stepFrom(d, b.freq), n++) {
        out.push({ bill: b, date: d });
      }
    });
    return out.sort(function (a, b) { return a.date - b.date; });
  }
  function sumUpcoming(list) { return list.reduce(function (s, u) { return s + u.bill.amount; }, 0); }

  function whenWord(d, dueNow) {
    if (dueNow) return 'Due now';
    var days = Math.round((dayStart(d) - dayStart(new Date())) / DAY);
    if (days === 0) return 'Today';
    if (days === 1) return 'Tomorrow';
    return fmtDate(d, { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function billAmt(b) { return (b.variable ? '≈ ' : '') + money(b.amount); }
  function billSub(b) { return b.shared ? ' · your ' + b.shared.share + '% of ' + (b.variable ? '≈ ' : '') + money(b.full) : ''; }

  // For each shared bill: what they should have paid you back this period,
  // and what's actually come in. Only the gap is shown.
  function sharedOwed(r) {
    var out = [];
    Object.keys(shared).forEach(function (k) {
      var sh = shared[k], paid = 0, got = 0;
      txInRange(r).forEach(function (t) {
        var a = Number(t.amount) || 0;
        if (a < 0 && txKey(t) === k) paid += -a;
        else if (a > 0 && sharedFor(t) === sh) got += a;
      });
      var expected = paid * (100 - (Number(sh.share) || 100)) / 100;
      if (expected - got > 1) out.push({ key: k, who: sh.who || 'They', owed: expected - got, expected: expected, got: got });
    });
    return out;
  }
  function owedHtml(r) {
    return sharedOwed(r).map(function (o) {
      return '<div class="banner warn">' + esc(o.who) + ' owes you ' + money(o.owed) + ' for ' + esc(o.key) +
             (o.got > 0 ? ' (' + money(o.got) + ' of ' + money(o.expected) + ' paid back so far)' : '') + '.</div>';
    }).join('');
  }

  // A section that folds away. Header shows a short summary so it's useful
  // even while folded. Remembered per section.
  function foldHtml(id, title, summary, body) {
    var open = !!openSections[id];
    return '<button class="fold' + (open ? ' open' : '') + '" data-fold="' + id + '">' +
             '<span class="ft">' + esc(title) + '</span>' +
             '<span class="fs">' + summary + '</span><span class="fc">▾</span></button>' +
           (open ? body : '');
  }
  function wireFolds(el) {
    Array.prototype.forEach.call(el.querySelectorAll('[data-fold]'), function (b) {
      b.addEventListener('click', function () {
        openSections[b.dataset.fold] = !openSections[b.dataset.fold];
        store.set('openSections', openSections); render();
      });
    });
  }

  // Recent money coming in, grouped by who it's from — to pick whose
  // repayments go with a shared bill.
  function incomingPayers() {
    var seen = {}, list = [];
    allTx().slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); }).forEach(function (t) {
      if (!(Number(t.amount) > 0) || t.type === 'TRANSFER') return;
      var k = txKey(t);
      if (seen[k]) return;
      seen[k] = true; list.push({ key: k, amount: Number(t.amount) });
    });
    return list.slice(0, 8);
  }

  function openBillSheet(b) {
    var sh = shared[b.key];
    var payers = incomingPayers();
    var splitHtml = sh
      ? '<div class="banner ok">Split with ' + esc(sh.who || 'someone') + ' — you pay ' + sh.share + '%. ' +
          'Their payments containing “' + esc(sh.from) + '” come off ' + esc(sh.cat) + ' instead of counting as income.</div>' +
        '<button class="btn ghost small" id="unsplitBtn">Stop splitting this bill</button>'
      : '<h2 class="sec" style="margin-top:4px;">Split this bill</h2>' +
        '<div class="field"><label>Who pays you back</label><input type="text" id="spWho" placeholder="e.g. William"></div>' +
        '<div class="field"><label>Your share</label><div class="t-row"><input type="number" id="spShare" min="1" max="99" value="50"><span>%</span></div></div>' +
        '<div class="field"><label>Their payments show on your statement as</label>' +
          '<input type="text" id="spFrom" placeholder="e.g. DOWIE">' +
          (payers.length ? '<div class="chips">' + payers.map(function (p) {
              return '<button class="pchip" data-from="' + esc(p.key) + '">' + esc(p.key) + ' <b>+' + money(p.amount) + '</b></button>';
            }).join('') + '</div>' : '') +
          '<div class="hint" id="spMatch">Tap one of your recent incoming payments above, or type part of the name.</div></div>' +
        '<button class="btn primary" id="splitBtn">Split bill</button>';
    $('sheet').innerHTML =
      '<h3>' + esc(b.name) + '</h3>' +
      '<div class="sub">' + FREQ_WORD[b.freq] + ' · ' + billAmt(b) + billSub(b) + ' · seen ' + b.count + ' times' +
        '<br>Next expected ' + esc(whenWord(b.next, b.dueNow)) +
        (b.variable ? '<br>The amount changes, so this is an average of the last few.' : '') + '</div>' +
      splitHtml +
      '<button class="btn ghost small" id="notBillBtn" style="margin-top:14px;">This isn\'t a regular bill</button>' +
      '<button class="btn ghost small" id="closeSheet" style="margin-top:8px;">Close</button>';
    $('scrim').classList.add('open');

    function countMatches(f) {
      f = String(f || '').trim().toUpperCase();
      if (f.length < 3) return null;
      return allTx().filter(function (t) {
        if (!(Number(t.amount) > 0)) return false;
        return (txKey(t) + ' ' + (t.description || '') + ' ' + (t.merchant && t.merchant.name || '')).toUpperCase().indexOf(f) !== -1;
      });
    }
    function showMatches() {
      var m = countMatches($('spFrom').value);
      $('spMatch').textContent = m === null ? 'Type at least 3 letters.'
        : m.length ? 'Matches ' + m.length + ' payment' + (m.length === 1 ? '' : 's') + ' in your history: ' +
            m.slice(0, 4).map(function (t) { return money(Number(t.amount)); }).join(', ') + (m.length > 4 ? '…' : '')
        : 'No payments match that yet — fine if they haven\'t paid you back before.';
    }
    if ($('spFrom')) {
      $('spFrom').addEventListener('input', showMatches);
      Array.prototype.forEach.call($('sheet').querySelectorAll('.pchip'), function (c) {
        c.addEventListener('click', function () { $('spFrom').value = c.dataset.from; showMatches(); });
      });
      $('splitBtn').addEventListener('click', function () {
        var from = $('spFrom').value.trim().toUpperCase();
        var share = Math.round(Number($('spShare').value) || 0);
        if (from.length < 3) { toast('Say how their payments show up'); return; }
        if (share < 1 || share > 99) { toast('Your share should be 1–99%'); return; }
        shared[b.key] = { share: share, from: from, who: $('spWho').value.trim() || 'They', cat: b.cat };
        store.set('shared', shared);
        $('scrim').classList.remove('open'); publishSummary(); render();
        toast('Split — you pay ' + share + '%');
      });
    }
    if ($('unsplitBtn')) $('unsplitBtn').addEventListener('click', function () {
      delete shared[b.key]; store.set('shared', shared);
      $('scrim').classList.remove('open'); publishSummary(); render();
      toast('No longer split');
    });
    $('notBillBtn').addEventListener('click', function () {
      notBills[b.key] = true; store.set('notBills', notBills);
      $('scrim').classList.remove('open'); publishSummary(); render();
      toast('Hidden — ' + b.name);
    });
    $('closeSheet').addEventListener('click', function () { $('scrim').classList.remove('open'); });
  }

  /* ---- budgets ---- */
  function budgetFor(cat) {
    var m = Number(budgets[cat]) || 0;
    if (!m) return 0;
    return settings.period === 'fortnight' && settings.anchor ? m * 12 / 26 : m;
  }
  // Where spending is heading by the end of the period.
  // Everyday spending (shops, food, fuel...) is assumed to carry on at its
  // daily pace so far. Regular bills are NOT spread across every day — a
  // power bill paid on the 8th doesn't mean you'll pay it again each day —
  // so they're counted as paid, plus the ones the app expects before the
  // period ends. Returns totals overall and per category.
  function forecast(r) {
    var bills = detectBills();
    var billKeys = {};
    bills.forEach(function (b) { billKeys[b.key] = true; });
    var list = txInRange(r);
    var all = totals(list);
    var everyday = totals(list.filter(function (t) { return !(Number(t.amount) < 0 && billKeys[txKey(t)]); }));
    var elapsed = daysElapsedIn(r), left = daysLeftIn(r);
    var upcoming = upcomingIn(r, bills);
    var upByCat = {};
    upcoming.forEach(function (u) { upByCat[u.bill.cat] = (upByCat[u.bill.cat] || 0) + u.bill.amount; });
    var perDay = everyday.out / elapsed;
    return {
      perDay: perDay,
      billsSoFar: Math.max(0, all.out - everyday.out),
      upcoming: sumUpcoming(upcoming),
      total: all.out + perDay * left + sumUpcoming(upcoming),
      forCat: function (c) {
        var spent = all.byCat[c] || 0;
        return spent + ((everyday.byCat[c] || 0) / elapsed) * left + (upByCat[c] || 0);
      }
    };
  }
  function budgetRowHtml(c, spent, r, fc) {
    var b = budgetFor(c);
    var proj = fc.forCat(c);
    var pct = b ? Math.min(100, Math.round(spent / b * 100)) : 0;
    var over = spent > b, heading = !over && proj > b * 1.02;
    var colour = over ? 'var(--danger)' : (heading ? 'var(--gold)' : 'var(--good)');
    var note = over ? money(spent - b) + ' over'
             : heading ? 'on track for ' + money(proj) + ' — ' + money(proj - b) + ' over'
             : money(b - spent) + ' left';
    return '<div class="catrow"><div class="top">' +
             '<span class="cn">' + esc(c) + '</span>' +
             '<span class="cv">' + money(spent) + '<span class="cp">of ' + money(b) + '</span></span>' +
           '</div><div class="track"><div class="fill" style="width:' + pct + '%;background:' + colour + ';"></div></div>' +
           '<div class="bnote" style="color:' + (over || heading ? colour : 'var(--muted)') + ';">' + note + '</div></div>';
  }
  function openBudgetSheet() {
    var fort = settings.period === 'fortnight' && settings.anchor;
    $('sheet').innerHTML =
      '<h3>Monthly budgets</h3>' +
      '<div class="sub">Leave a category blank for no budget.' +
        (fort ? ' You\'re on a fortnightly cycle, so each is shown as its fortnight share (x 12 ÷ 26).' : '') + '</div>' +
      SPEND_CATS.map(function (c) {
        return '<div class="brow"><span>' + esc(c) + '</span>' +
                 '<input type="number" inputmode="decimal" min="0" data-b="' + esc(c) + '" placeholder="—" value="' +
                   (budgets[c] ? esc(budgets[c]) : '') + '"></div>';
      }).join('') +
      '<button class="btn primary" id="saveBudgets" style="margin-top:14px;">Save budgets</button>' +
      '<button class="btn ghost small" id="closeSheet" style="margin-top:8px;">Cancel</button>';
    $('scrim').classList.add('open');
    $('saveBudgets').addEventListener('click', function () {
      var nb = {};
      Array.prototype.forEach.call($('sheet').querySelectorAll('[data-b]'), function (inp) {
        var v = Math.round(Number(inp.value) || 0);
        if (v > 0) nb[inp.dataset.b] = v;
      });
      budgets = nb; store.set('budgets', budgets);
      $('scrim').classList.remove('open');
      publishSummary(); render();
      toast(Object.keys(nb).length ? 'Budgets saved' : 'Budgets cleared');
    });
    $('closeSheet').addEventListener('click', function () { $('scrim').classList.remove('open'); });
  }

  function renderSpending() {
    var el = $('screen-spending');
    if (!settings.relayUrl || !settings.relayKey) { el.innerHTML = notSetUpHtml(); return; }

    var r = periodRange();
    var t = totals(txInRange(r));
    var cats = Object.keys(t.byCat).sort(function (a, b) { return t.byCat[b] - t.byCat[a]; });
    var max = cats.length ? t.byCat[cats[0]] : 0;

    var html = '<div class="card hero">' +
                 '<div class="lbl">Spent ' + esc(r.label) + '</div>' +
                 '<div class="big">' + money(t.out) + '</div>' +
                 '<div class="note">' + fmtDate(r.start, {day:'numeric',month:'short'}) +
                   ' – ' + fmtDate(r.end, {day:'numeric',month:'short'}) +
                   (r.nextLabel ? ' · ' + esc(r.nextLabel) : '') + '</div>' +
               '</div>';

    html += owedHtml(r);
    var budgeted = SPEND_CATS.filter(function (c) { return budgetFor(c) > 0; });
    var fc = forecast(r);
    if (budgeted.length) {
      var bTotal = 0, bSpent = 0;
      budgeted.forEach(function (c) { bTotal += budgetFor(c); bSpent += (t.byCat[c] || 0); });
      html += '<h2 class="sec">Budgets</h2><div class="card">' +
                budgeted.sort(function (a, b) { return (t.byCat[b] || 0) / budgetFor(b) - (t.byCat[a] || 0) / budgetFor(a); })
                  .map(function (c) { return budgetRowHtml(c, t.byCat[c] || 0, r, fc); }).join('') +
                '<div class="btotal">' + money(bSpent) + ' of ' + money(bTotal) + ' budgeted · ' +
                  daysLeftIn(r) + (daysLeftIn(r) === 1 ? ' day' : ' days') + ' to go</div>' +
              '</div>' +
              '<button class="btn ghost small" id="budgetBtn" style="margin-bottom:6px;">Edit budgets</button>';
    } else {
      html += '<button class="btn ghost small" id="budgetBtn" style="margin:14px 0 4px;">Set budgets</button>';
    }

    if (!cats.length) {
      html += '<div class="empty">No spending recorded in this period yet.</div>';
    } else {
      html += '<h2 class="sec">Where it went</h2><div class="card">';
      html += cats.map(function (c) {
        var v = t.byCat[c];
        var pct = t.out ? Math.round(v / t.out * 100) : 0;
        return '<div class="catrow"><div class="top">' +
                 '<span class="cn">' + esc(c) + '</span>' +
                 '<span class="cv">' + money(v) + '<span class="cp">' + pct + '%</span></span>' +
               '</div><div class="track"><div class="fill" style="width:' +
                 (max ? Math.round(v / max * 100) : 0) + '%;' +
                 (c === 'Uncategorised' ? 'background:var(--gold);' : '') + '"></div></div></div>';
      }).join('');
      html += '</div>';
      if (t.byCat['Uncategorised']) {
        var n = uncategorisedGroups().length;
        html += '<div class="banner warn">' + money(t.byCat['Uncategorised']) + ' still uncategorised' +
                (n ? ', across ' + n + (n === 1 ? ' shop' : ' different shops') : '') + '.</div>' +
                '<button class="btn primary" id="tidyBtn">Sort them out</button>';
      }
    }
    var bills = detectBills();
    var hidden = Object.keys(notBills).length;
    if (bills.length || hidden) {
      var perMonth = bills.reduce(function (s, b) { return s + b.perMonth; }, 0);
      html += foldHtml('regular', 'Regular payments', bills.length + ' · ≈ ' + money(perMonth) + '/mo', '<div class="card">' +
        bills.map(function (b, i) {
          return '<div class="bill" data-b="' + i + '"><div class="bi"><div class="bn">' + esc(b.name) + '</div>' +
                   '<div class="bw">' + FREQ_WORD[b.freq] + ' · next ' + esc(whenWord(b.next, b.dueNow)) + billSub(b) + '</div></div>' +
                 '<div class="ba">' + billAmt(b) + '</div></div>';
        }).join('') +
        '<div class="btotal">' + (bills.length ? '≈ ' + money(perMonth) + ' a month in regular payments. Tap one that isn\'t really a bill to hide it.' : 'Nothing regular spotted.') +
          (hidden ? ' <button class="linkbtn" id="unhideBills">Show ' + hidden + ' hidden</button>' : '') + '</div>' +
      '</div>');
    }

    el.innerHTML = html;
    wireFolds(el);
    Array.prototype.forEach.call(el.querySelectorAll('.bill[data-b]'), function (row) {
      row.addEventListener('click', function () { openBillSheet(bills[Number(row.dataset.b)]); });
    });
    if ($('unhideBills')) $('unhideBills').addEventListener('click', function () {
      notBills = {}; store.set('notBills', notBills); publishSummary(); render();
    });
    if ($('tidyBtn')) $('tidyBtn').addEventListener('click', openTidySheet);
    if ($('budgetBtn')) $('budgetBtn').addEventListener('click', openBudgetSheet);
  }

  function renderActivity() {
    var el = $('screen-activity');
    if (!settings.relayUrl || !settings.relayKey) { el.innerHTML = notSetUpHtml(); return; }

    var list = allTx().slice().sort(function (a, b) {
      return new Date(b.date).getTime() - new Date(a.date).getTime();
    });

    if (!list.length) {
      el.innerHTML = '<div class="empty">No transactions yet. Pull them in from the Overview screen.</div>';
      return;
    }

    var html = '';
    var ug = uncategorisedGroups();
    if (ug.length) {
      html += '<button class="btn ghost small" id="tidyBtn2" style="margin-bottom:14px;">' +
              'Sort out ' + ug.length + ' uncategorised ' + (ug.length === 1 ? 'shop' : 'shops') + '</button>';
    }
    var lastDay = '';
    list.slice(0, 300).forEach(function (t, i) {
      var d = new Date(t.date);
      var day = fmtDate(d, { weekday:'short', day:'numeric', month:'short' });
      if (day !== lastDay) { html += '<div class="daylbl">' + esc(day) + '</div>'; lastDay = day; }
      var amt = Number(t.amount) || 0;
      var cat = categoryOf(t);
      var name = (t.merchant && t.merchant.name) || t.description || 'Transaction';
      html += '<div class="tx" data-i="' + i + '">' +
                '<div class="ti"><div class="tn">' + esc(name) + '</div>' +
                  '<div class="tc"><span class="chip' + (cat === 'Uncategorised' ? ' none' : '') + '">' + esc(cat) + '</span>' +
                    (t._pending ? ' <span class="chip pend">Pending</span>' : '') +
                    (amt > 0 && isSpendCat(cat) ? ' <span class="chip">' + (sharedFor(t) ? 'Paid back' : 'Refund') + '</span>' : '') + '</div></div>' +
                '<div class="ta' + (amt > 0 ? ' in' : '') + (t._pending ? ' pend' : '') + '">' + (amt > 0 ? '+' : '') + moneyExact(amt) + '</div>' +
              '</div>';
    });
    el.innerHTML = html;

    if ($('tidyBtn2')) $('tidyBtn2').addEventListener('click', openTidySheet);
    Array.prototype.forEach.call(el.querySelectorAll('.tx[data-i]'), function (row) {
      row.addEventListener('click', function () { openCategorySheet(list[Number(row.dataset.i)]); });
    });
  }

  function openCategorySheet(t) {
    var current = categoryOf(t);
    var name = (t.merchant && t.merchant.name) || t.description || 'Transaction';
    $('sheet').innerHTML =
      '<h3>' + esc(name) + '</h3>' +
      '<div class="sub">' + moneyExact(Number(t.amount) || 0) + ' · ' +
        fmtDate(new Date(t.date), {day:'numeric',month:'long'}) +
        '<br>Choosing a category here also applies it to anything else from ' + esc(txKey(t)) + '.</div>' +
      '<div class="catgrid">' +
        CATEGORIES.map(function (c) {
          return '<button data-cat="' + esc(c) + '" class="' + (c === current ? 'on' : '') + '">' + esc(c) + '</button>';
        }).join('') +
      '</div>' +
      '<button class="btn ghost small" id="closeSheet" style="margin-top:14px;">Close</button>';
    $('scrim').classList.add('open');

    Array.prototype.forEach.call($('sheet').querySelectorAll('[data-cat]'), function (b) {
      b.addEventListener('click', function () {
        setCategory(t, b.dataset.cat);
        $('scrim').classList.remove('open');
        publishSummary();
        render();
        toast('Saved — ' + b.dataset.cat);
      });
    });
    $('closeSheet').addEventListener('click', function () { $('scrim').classList.remove('open'); });
  }

  /* ---- sorting out everything still uncategorised, shop by shop ---- */
  function uncategorisedGroups() {
    var groups = {};
    allTx().forEach(function (t) {
      if (Number(t.amount) >= 0) return;                 // money in isn't spending
      if (categoryOf(t) !== 'Uncategorised') return;
      var k = txKey(t);
      if (!groups[k]) groups[k] = { key: k, name: (t.merchant && t.merchant.name) || k, count: 0, total: 0 };
      groups[k].count++;
      groups[k].total += Math.abs(Number(t.amount) || 0);
    });
    return Object.keys(groups).map(function (k) { return groups[k]; })
      .sort(function (a, b) { return b.total - a.total; });
  }

  function openTidySheet() {
    var groups = uncategorisedGroups();
    if (!groups.length) {
      $('sheet').innerHTML = '<h3>All sorted</h3><div class="sub">Nothing left uncategorised.</div>' +
        '<button class="btn ghost small" id="closeSheet">Close</button>';
      $('scrim').classList.add('open');
      $('closeSheet').addEventListener('click', function () { $('scrim').classList.remove('open'); render(); });
      return;
    }
    $('sheet').innerHTML =
      '<h3>' + groups.length + ' to sort</h3>' +
      '<div class="sub">Biggest first. Pick a category once and every transaction from that shop is sorted — ' +
        'the ones already here and anything that turns up later.</div>' +
      groups.map(function (g, i) {
        return '<div class="tx" data-g="' + i + '">' +
                 '<div class="ti"><div class="tn">' + esc(g.name) + '</div>' +
                   '<div class="tc">' + g.count + (g.count === 1 ? ' transaction' : ' transactions') + '</div></div>' +
                 '<div class="ta">' + money(g.total) + '</div>' +
               '</div>';
      }).join('') +
      '<button class="btn ghost small" id="closeSheet" style="margin-top:14px;">Done for now</button>';
    $('scrim').classList.add('open');

    Array.prototype.forEach.call($('sheet').querySelectorAll('[data-g]'), function (row) {
      row.addEventListener('click', function () { tidyPick(groups[Number(row.dataset.g)]); });
    });
    $('closeSheet').addEventListener('click', function () { $('scrim').classList.remove('open'); render(); });
  }

  function tidyPick(g) {
    $('sheet').innerHTML =
      '<h3>' + esc(g.name) + '</h3>' +
      '<div class="sub">' + g.count + (g.count === 1 ? ' transaction · ' : ' transactions · ') + money(g.total) +
        '<br>Whatever you pick applies to all of them.</div>' +
      '<div class="catgrid">' +
        CATEGORIES.map(function (c) { return '<button data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') +
      '</div>' +
      '<button class="btn ghost small" id="backTidy" style="margin-top:14px;">Back</button>';

    Array.prototype.forEach.call($('sheet').querySelectorAll('[data-cat]'), function (b) {
      b.addEventListener('click', function () {
        rules[g.key] = b.dataset.cat;
        store.set('rules', rules);
        publishSummary();
        openTidySheet();                                  // back to the list, one shorter
      });
    });
    $('backTidy').addEventListener('click', openTidySheet);
  }

  function renderSettings() {
    var el = $('screen-settings');
    var html = '';

    html += '<h2 class="sec">Your relay</h2>';
    html += '<div class="card">' +
      '<div class="field"><label>Relay address</label>' +
        '<input type="text" id="setUrl" placeholder="https://forge-finance-relay.you.workers.dev" value="' + esc(settings.relayUrl) + '">' +
        '<div class="hint">The web address Cloudflare gave your worker.</div></div>' +
      '<div class="field"><label>Relay password</label>' +
        '<input type="password" id="setKey" placeholder="the RELAY_KEY you invented" value="' + esc(settings.relayKey) + '">' +
        '<div class="hint">Must match the RELAY_KEY secret on the worker. Your Akahu tokens are not stored here — they stay on the relay.</div></div>' +
      '<button class="btn ghost small" id="testBtn">Test connection</button>' +
      '<div id="testOut" style="margin-top:10px;"></div>' +
    '</div>';

    html += '<h2 class="sec">Your pay cycle</h2>';
    html += '<div class="card">' +
      '<div class="field"><label>Track spending by</label>' +
        '<div class="seg">' +
          '<button id="pMonth" class="' + (settings.period !== 'fortnight' ? 'on' : '') + '">Calendar month</button>' +
          '<button id="pFort" class="' + (settings.period === 'fortnight' ? 'on' : '') + '">Fortnight</button>' +
        '</div></div>' +
      (settings.period === 'fortnight' ?
        '<div class="field"><label>A recent payday</label>' +
          '<input type="date" id="setAnchor" value="' + esc(settings.anchor || '') + '">' +
          '<div class="hint">Any payday will do — it counts forward in fortnights from there.</div></div>' : '') +
      '<div class="field"><label>How much history to pull</label>' +
        '<input type="number" id="setDays" min="7" max="730" value="' + esc(settings.historyDays || 90) + '">' +
        '<div class="hint">Days. 90 is plenty for spotting patterns.</div></div>' +
      '<button class="btn primary" id="saveBtn">Save settings</button>' +
    '</div>';

    var lastB = null;
    try { lastB = localStorage.getItem('ecosystem_lastBackup'); } catch (e) {}
    html += '<h2 class="sec">Backup</h2>';
    html += '<div class="card">' +
      '<div style="font-size:13px;color:var(--muted);line-height:1.6;">' +
        (lastB
          ? 'Everything your Forge apps hold on this phone was last copied to your relay ' +
            esc(agoText(lastB).replace(/^synced /, '')) + '.'
          : 'Nothing has been backed up yet. One goes automatically next time you open any of your apps.') +
      '</div>' +
      '<button class="btn ghost small" id="backupNowBtn" style="margin-top:10px;">Back up now</button>' +
      '<button class="btn ghost small" id="restoreBtn" style="margin-top:8px;">Restore from backup</button>' +
      '<div id="backupOut" style="margin-top:10px;"></div>' +
    '</div>';

    html += '<h2 class="sec">Data</h2>';
    html += '<div class="card">' +
      '<div style="font-size:13px;color:var(--muted);line-height:1.6;">' +
        Object.keys(rules).length + ' category rules learned · ' +
        (cache.transactions || []).length + ' transactions held' +
        ((cache.pending || []).length ? ' (+' + cache.pending.length + ' pending)' : '') + ' · ' + esc(agoText(cache.syncedAt)) +
      '</div>' +
      '<button class="btn danger" id="clearBtn" style="margin-top:10px;">Clear everything stored on this phone</button>' +
    '</div>';

    el.innerHTML = html;

    $('pMonth').addEventListener('click', function () { settings.period = 'month'; store.set('settings', settings); renderSettings(); });
    $('pFort').addEventListener('click', function () { settings.period = 'fortnight'; store.set('settings', settings); renderSettings(); });

    $('saveBtn').addEventListener('click', function () {
      settings.relayUrl = $('setUrl').value.trim();
      settings.relayKey = $('setKey').value.trim();
      settings.historyDays = Math.max(7, Math.min(730, Number($('setDays').value) || 90));
      if ($('setAnchor')) settings.anchor = $('setAnchor').value;
      store.set('settings', settings);
      toast('Saved');
      render();
    });

    $('testBtn').addEventListener('click', function () {
      settings.relayUrl = $('setUrl').value.trim();
      settings.relayKey = $('setKey').value.trim();
      store.set('settings', settings);
      $('testOut').innerHTML = '<div class="banner warn">Checking…</div>';
      relayGet('/accounts').then(function (b) {
        var n = (b && b.items ? b.items.length : 0);
        $('testOut').innerHTML = '<div class="banner ok">Connected. ' + n + ' account' + (n === 1 ? '' : 's') + ' found.</div>';
      }).catch(function (e) {
        $('testOut').innerHTML = '<div class="banner bad">' + esc(e.message || String(e)) + '</div>';
      });
    });

    $('backupNowBtn').addEventListener('click', function () {
      if (!window.ecosystemBackup) { $('backupOut').innerHTML = '<div class="banner bad">Backup isn\'t loaded.</div>'; return; }
      $('backupOut').innerHTML = '<div class="banner warn">Sending…</div>';
      window.ecosystemBackup.send().then(function (b) {
        $('backupOut').innerHTML = '<div class="banner ok">Backed up — ' +
          Math.round((b.bytes || 0) / 1024) + ' KB stored.</div>';
      }).catch(function (e) {
        $('backupOut').innerHTML = '<div class="banner bad">' + esc(e.message || String(e)) + '</div>';
      });
    });

    $('restoreBtn').addEventListener('click', function () {
      $('backupOut').innerHTML = '<div class="banner warn">Fetching your backup…</div>';
      relayGet('/backup').then(function (snap) {
        if (!snap || !snap.keys) throw new Error('That backup looks empty.');
        var count = Object.keys(snap.keys).length;
        var when = snap.takenAt ? new Date(snap.takenAt).toLocaleString() : 'an unknown time';
        $('backupOut').innerHTML = '';
        $('sheet').innerHTML =
          '<h3>Restore this backup?</h3>' +
          '<div class="sub">Taken ' + esc(when) + ', holding ' + count + ' saved items across your apps.' +
          '<br><br>This replaces what\'s on this phone now with what was saved then. ' +
          'Anything logged since that backup would be lost.</div>' +
          '<button class="btn primary" id="confirmRestore">Yes, restore it</button>' +
          '<button class="btn ghost small" id="cancelRestore" style="margin-top:9px;">Cancel</button>';
        $('scrim').classList.add('open');
        $('confirmRestore').addEventListener('click', function () {
          var written = 0;
          Object.keys(snap.keys).forEach(function (k) {
            try { localStorage.setItem(k, snap.keys[k]); written++; } catch (e) {}
          });
          $('scrim').classList.remove('open');
          toast('Restored ' + written + ' items');
          setTimeout(function () { location.reload(); }, 900);
        });
        $('cancelRestore').addEventListener('click', function () { $('scrim').classList.remove('open'); });
      }).catch(function (e) {
        $('backupOut').innerHTML = '<div class="banner bad">' + esc(e.message || String(e)) + '</div>';
      });
    });

    $('clearBtn').addEventListener('click', function () {
      $('sheet').innerHTML = '<h3>Clear stored data?</h3>' +
        '<div class="sub">This wipes the cached transactions, your category rules and your relay settings from this phone. ' +
        'Nothing at Akahu or Cloudflare is touched, and you can set it up again any time.</div>' +
        '<button class="btn primary" id="confirmClear" style="background:var(--danger);color:#fff;">Yes, clear it</button>' +
        '<button class="btn ghost small" id="cancelClear" style="margin-top:9px;">Cancel</button>';
      $('scrim').classList.add('open');
      $('confirmClear').addEventListener('click', function () {
        ['settings','cache','rules','summary','budgets','notBills','shared','openSections'].forEach(function (k) {
          try { localStorage.removeItem(APP_PREFIX + k); } catch (e) {}
        });
        settings = { relayUrl:'', relayKey:'', period:'month', anchor:'', historyDays:90 };
        cache = { accounts: [], transactions: [], syncedAt: null };
        rules = {};
        $('scrim').classList.remove('open');
        render();
        toast('Cleared');
      });
      $('cancelClear').addEventListener('click', function () { $('scrim').classList.remove('open'); });
    });
  }

  var currentScreen = 'overview';
  function render() {
    if (currentScreen === 'overview') renderOverview();
    else if (currentScreen === 'spending') renderSpending();
    else if (currentScreen === 'activity') renderActivity();
    else renderSettings();
    var r = periodRange();
    $('topSub').innerHTML = esc(r.label) + '<br>' + esc(agoText(cache.syncedAt));
  }

  function switchScreen(name) {
    currentScreen = name;
    Array.prototype.forEach.call(document.querySelectorAll('.screen'), function (s) { s.classList.remove('active'); });
    $('screen-' + name).classList.add('active');
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.classList.toggle('active', t.dataset.screen === name);
    });
    render();
    window.scrollTo(0, 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () { switchScreen(t.dataset.screen); });
  });
  $('scrim').addEventListener('click', function (e) { if (e.target === $('scrim')) $('scrim').classList.remove('open'); });

  function boot() {
    render();
    publishSummary();
    // If it's been a while and we're set up, quietly refresh in the background.
    var stale = !cache.syncedAt || (Date.now() - new Date(cache.syncedAt).getTime()) > 6 * 3600000;
    if (settings.relayUrl && settings.relayKey && stale) sync();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function () {});
  }

  boot();
})();
</script>
<!-- ============================================================
     ECOSYSTEM AUTO-BACKUP
     Paste this block just before </body> in every Forge app.
     It is identical in all of them.

     Once a day, whichever app you happen to open takes a copy of
     everything all the apps have stored on this phone and sends it
     to your own Cloudflare relay. Nothing to remember, nothing to tap.

     It reads the relay address and password from Forge Finance's
     settings, so you only ever set those up once.

     If the relay isn't set up, or the phone is offline, or anything
     at all goes wrong, it gives up quietly. A backup must never be
     the reason an app misbehaves.
     ============================================================ -->
<script>
(function () {
  "use strict";

  var EVERY_HOURS = 24;
  var STAMP_KEY = 'ecosystem_lastBackup';
  var SETTINGS_KEY = 'finance_settings';

  function relay() {
    try {
      var s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
      if (!s || !s.relayUrl || !s.relayKey) return null;
      var base = String(s.relayUrl).trim().replace(/\/+$/, '');
      if (!/^https?:\/\//i.test(base)) base = 'https://' + base;
      return { base: base, key: s.relayKey };
    } catch (e) { return null; }
  }

  function due() {
    try {
      var last = localStorage.getItem(STAMP_KEY);
      if (!last) return true;
      var age = Date.now() - new Date(last).getTime();
      return !(age >= 0) || age > EVERY_HOURS * 3600000;
    } catch (e) { return false; }
  }

  // Everything every app has stored here, exactly as stored.
  function snapshot() {
    var keys = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k === STAMP_KEY) continue;
        keys[k] = localStorage.getItem(k);
      }
    } catch (e) {}
    return {
      v: 1,
      takenAt: new Date().toISOString(),
      takenBy: document.title || location.pathname,
      origin: location.origin,
      keys: keys
    };
  }

  // Send one now. Returns a promise so a Back up now button can report back.
  function send() {
    var r = relay();
    if (!r) return Promise.reject(new Error('No relay set up yet — add it in Forge Finance settings.'));
    var snap = snapshot();
    if (!Object.keys(snap.keys).length) return Promise.reject(new Error('Nothing stored to back up.'));

    return fetch(r.base + '/backup', {
      method: 'POST',
      headers: { 'X-Relay-Key': r.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(snap)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) throw new Error(body.error || ('Relay returned ' + res.status));
        try { localStorage.setItem(STAMP_KEY, new Date().toISOString()); } catch (e) {}
        return body;
      });
    });
  }

  // The automatic one: quiet, and only when it's due.
  function run() {
    if (!relay() || !due()) return;
    send().catch(function () { /* offline or relay down - try again tomorrow */ });
  }

  // So an app's settings screen can offer "Back up now".
  window.ecosystemBackup = { send: send, snapshot: snapshot, relay: relay, stampKey: STAMP_KEY };

  // Well after the app has finished starting up, so it never competes.
  function start() { setTimeout(run, 3000); }
  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);
})();
</script>
